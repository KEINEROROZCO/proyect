<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Galaxia de Girasoles & Agujero Negro 3D | Amor Infinito 🌻✨</title>

  <!-- Google Fonts for modern romantic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <script type="module" crossorigin src="/proyect/assets/index-CTHf3kz9.js"></script>
  <link rel="stylesheet" crossorigin href="/proyect/assets/index-C9HeMCAS.css">
</head>
<body>
  <!-- Canvas for 3D Three.js Scene -->
  <div id="canvas-container"></div>

  <!-- Animated Glowing Hearts Border Overlay -->
  <div class="glowing-hearts-frame">
    <div class="frame-corner top-left">💖</div>
    <div class="frame-corner top-right">💖</div>
    <div class="frame-corner bottom-left">💖</div>
    <div class="frame-corner bottom-right">💖</div>
    <div class="hearts-border-line top"></div>
    <div class="hearts-border-line bottom"></div>
    <div class="hearts-border-line left"></div>
    <div class="hearts-border-line right"></div>
  </div>

  <!-- Romantic Ambient Floating Hearts Particle Container -->
  <div id="floating-hearts-overlay"></div>

  <!-- Top Glassmorphism Navigation Bar -->
  <header class="top-nav">
    <div class="logo-title">
      <span class="icon-sunflower">🌻</span>
      <div>
        <h1>Galaxia de Girasoles</h1>
        <p class="subtitle">Universo de Amor & Agujero Negro Infinito ✨</p>
      </div>
    </div>

    <div class="nav-controls">
      <div class="preset-selector">
        <label for="scene-preset">Modo:</label>
        <select id="scene-preset">
          <option value="galaxy">🌻 Galaxia Dorada</option>
          <option value="blackhole">🕳️ Agujero Negro Infinito</option>
          <option value="shower">✨ Lluvia de Girasoles</option>
          <option value="hearts">💖 Noche Romántica</option>
        </select>
      </div>

      <button id="btn-custom-message" class="btn-glass">
        <span>✍️</span> Crear Mensaje
      </button>

      <button id="btn-fullscreen" class="btn-glass icon-only" title="Pantalla Completa">
        ⛶
      </button>
    </div>
  </header>

  <!-- Dynamic Floating Spanish Romantic Quotes Container -->
  <div id="romantic-quotes-container"></div>

  <!-- Interactive Modal for Custom Romantic Messages -->
  <div id="custom-message-modal" class="modal hidden">
    <div class="modal-content glass-card">
      <button class="modal-close" id="modal-close">&times;</button>
      <h2>💖 Enviar Mensaje a la Galaxia</h2>
      <p>Escribe tu mensaje especial para que orbite junto a los girasoles dorados:</p>

      <div class="input-group">
        <input type="text" id="input-sender" placeholder="Tu nombre o apodo (ej. Tu Amor)..." maxlength="30">
        <textarea id="input-message" placeholder="Escribe aquí tu mensaje de amor..." rows="3" maxlength="140"></textarea>
      </div>

      <div class="modal-actions">
        <button id="btn-send-message" class="btn-glow">
          ✨ Lanzar a la Galaxia 🌻
        </button>
      </div>
    </div>
  </div>

  <!-- Main JavaScript Bundle Entry point -->
</body>
</html>
